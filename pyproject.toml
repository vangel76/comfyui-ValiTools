[project]
name = "valitools"
description = "ValiTools node collection: VSmartPrompt (Dynamic Prompts with rich-text editor, reusable variables, switcher conditions, chaining inputs and post-run selection highlighting), VFileRandom (no-repeat random image loader) and VRandomSelector (lazy random passthrough of N same-type inputs) and VWaitForVRAM (hold execution until enough VRAM is free)."
version = "1.14.3"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/vangel76/comfyui-ValiTools"
"Bug Tracker" = "https://github.com/vangel76/comfyui-ValiTools/issues"

[tool.comfy]
PublisherId = "vangel"
DisplayName = "ValiTools"
